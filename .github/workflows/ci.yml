name: CI
# Package gate on every push/PR: lint, unit tests, d.ts typecheck, and the crashless package validator (also re-checks the vendored native binaries).
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run typecheck
      - run: npm run validate:package
      - name: Pack (dry run)
        run: npm pack --dry-run --ignore-scripts
